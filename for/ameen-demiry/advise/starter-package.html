  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8231d3d7-c38e-49b8-b608-69b78f0f085f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: #FAF8F4; }\n  a { color: #C8492E; text-decoration: none; }\n  a:hover { color: #B23E26; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#FAF8F4; min-height:100vh; padding:64px 24px 120px; font-family:'Hanken Grotesk',sans-serif; color:#1A1A1A; -webkit-font-smoothing:antialiased;\">\n<div style=\"max-width:840px; margin:0 auto; background:#FAF8F4; border:1px solid #E7E2D9;\">\n\n  <div style=\"padding:52px 56px 44px; border-bottom:1px solid #E7E2D9;\">\n    <div style=\"margin-bottom:30px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;\"><span style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 600; font-size:20px; letter-spacing:-0.015em; white-space:nowrap;\">Make It Land<span style=\"color:#C8492E;\">.<\u002Fspan><\u002Fspan><span style=\"font-size:11.5px; letter-spacing:0.2em; text-transform:uppercase; color:#6B6661; font-weight:600;\">Studio<\u002Fspan><span style=\"font-size:11.5px; color:#6B6661; font-weight:600;\">/<\u002Fspan><span style=\"font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#C8492E; font-weight:600;\">{{ packageName }}<\u002Fspan><\u002Fdiv>\n    <h1 style=\"margin:0 0 22px; font-family:'Fraunces',serif; font-variation-settings:'opsz' 144,'wght' 600; font-size:64px; line-height:1.03; letter-spacing:-0.015em; max-width:680px; text-wrap:pretty;\">Your work is better than your site says it is.<\u002Fh1>\n    <p style=\"margin:0 0 16px; font-size:19px; line-height:1.55; color:#1A1A1A; max-width:600px; text-wrap:pretty;\">One surface, read three ways: what you are selling, whether the page makes the decision easy, and whether any of it is proven. You come out knowing why the right people are not choosing you, and what to change first.<\u002Fp>\n    <p style=\"margin:0 0 30px; font-size:16px; line-height:1.55; color:#6B6661; max-width:560px;\">Most site reviews hand you a list of what is broken. This one starts before that.<\u002Fp>\n    <div style=\"display:flex; gap:24px; align-items:center; flex-wrap:wrap;\">\n      <a href=\"#start\" style=\"display:inline-block; background:#B23E26; color:#FAF8F4; font-size:15px; font-weight:600; padding:13px 24px;\">Book the free call<\u002Fa>\n      <div style=\"font-size:15px; color:#6B6661;\">{{ price }}, credited in full against a build.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:40px 56px 38px; border-bottom:1px solid #E7E2D9; display:flex; gap:40px; flex-wrap:wrap;\">\n    <div style=\"flex:1 1 340px; min-width:300px;\">\n      <h2 style=\"margin:0 0 12px; font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:28px; line-height:1.25; letter-spacing:-0.015em;\">Who this is for<\u002Fh2>\n      <p style=\"margin:0; font-size:16.5px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">Founders and leaders selling something considered. If the traffic is fine and the enquiries are not, or if you cannot say in one sentence why someone picks you over the obvious alternative, this is the right starting point.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:0 1 240px; min-width:220px; border-left:1px solid #E7E2D9; padding-left:20px;\">\n      <div style=\"font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600; margin-bottom:12px;\">Who it is not for<\u002Fdiv>\n      <p style=\"margin:0; font-size:15px; line-height:1.55; color:#6B6661;\">Anyone who wants a checklist. The technical pass is included, but it is the smallest part of the work.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:40px 56px 38px; border-bottom:1px solid #E7E2D9;\">\n    <h2 style=\"margin:0 0 26px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">What it covers<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:28px;\">\n      <div>\n        <div style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:32px; color:#C8492E; line-height:1;\">01<\u002Fdiv>\n        <h3 style=\"margin:8px 0 6px; font-size:15.5px; font-weight:600;\">Positioning<\u002Fh3>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#6B6661;\">The one overlooked thing that makes you the obvious choice, and whether the surface says it or buries it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:32px; color:#C8492E; line-height:1;\">02<\u002Fdiv>\n        <h3 style=\"margin:8px 0 6px; font-size:15.5px; font-weight:600;\">The site<\u002Fh3>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#6B6661;\">Who is choosing you, what they arrived to decide, and every place the page makes that decision harder than it needs to be.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:32px; color:#C8492E; line-height:1;\">03<\u002Fdiv>\n        <h3 style=\"margin:8px 0 6px; font-size:15.5px; font-weight:600;\">The proof<\u002Fh3>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#6B6661;\">Claims asserted against claims evidenced. What happened, what changed, what it was worth.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:40px 56px 38px; border-bottom:1px solid #E7E2D9; display:flex; gap:40px; flex-wrap:wrap;\">\n    <div style=\"flex:0 0 auto; width:150px;\">\n      <h2 style=\"margin:0 0 12px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">Who does this<\u002Fh2>\n      <div style=\"font-size:15px; font-weight:600;\">Nicole Miñoza<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 380px; min-width:320px; display:flex; flex-direction:column; gap:14px;\">\n      <p style=\"margin:0; font-size:16.5px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">For two decades I worked on the most overlooked thing in software: typography. Everyone used it, almost no one thought it mattered. I turned it from a finishing touch into a reason people chose Adobe and stayed, across twenty-three years and a product line used by millions.<\u002Fp>\n      <p style=\"margin:0; font-size:16.5px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">That is the method. Find the advantage a business has learned to overlook, make it measurable, and design everything around it until it becomes the reason you get picked.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:40px 56px 38px; border-bottom:1px solid #E7E2D9; background:#F1ECE3;\">\n    <h2 style=\"margin:0 0 22px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">From a recent review<\u002Fh2>\n    <div style=\"display:flex; gap:40px; flex-wrap:wrap; align-items:flex-start;\">\n      <div style=\"flex:1 1 320px; min-width:290px;\">\n        <div style=\"font-size:15px; font-weight:600; margin-bottom:14px;\">FORE REAL Golf, direct-to-consumer apparel<\u002Fdiv>\n        <p style=\"margin:0 0 14px; font-size:16px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">Golf apparel sells aspiration to people who are, statistically, not very good at golf. Every brand in the category talks to the player who breaks 80. FORE REAL talks to everyone else, and the jokes are excellent, but nowhere does the site say plainly who it is for. The review named the line the brand had already earned and never written down.<\u002Fp>\n        <p style=\"margin:0 0 24px; font-size:16px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">Then the defects. One of the homepage's two calls to action returned a 404, and a line of developer debug text was rendering on every page of a live store. Six findings, severity ranked, with a fix list scoped to one weekend. Both critical items were single-line changes.<\u002Fp>\n        <blockquote style=\"margin:0; border-left:2px solid #C8492E; padding-left:22px;\">\n          <p style=\"margin:0 0 14px; font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 400; font-size:23px; line-height:1.45; color:#1A1A1A; text-wrap:pretty;\">She spent as much time on what to keep as on what to fix, which I wasn't expecting. Then she found a dead button in my homepage hero and debug text on every page of a live store. Both were one-line fixes. I wouldn't have found either.<\u002Fp>\n          <footer style=\"font-size:13.5px; letter-spacing:0.04em; color:#6B6661;\">Elisha Herzog, Founder, FORE REAL Golf<\u002Ffooter>\n        <\u002Fblockquote>\n      <\u002Fdiv>\n      <div style=\"flex:0 1 200px; min-width:180px; display:flex; flex-direction:column; gap:20px;\">\n        <div><div style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:38px; line-height:1;\">1<\u002Fdiv><div style=\"font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B6661; font-weight:600; margin-top:4px;\">Positioning line the brand already owned<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:38px; line-height:1;\">2<\u002Fdiv><div style=\"font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B6661; font-weight:600; margin-top:4px;\">Critical defects, both one-line fixes<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:40px 56px 38px; border-bottom:1px solid #E7E2D9;\">\n    <h2 style=\"margin:0 0 8px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">The document<\u002Fh2>\n    <p style=\"margin:0 0 26px; font-size:16px; line-height:1.6; color:#6B6661; max-width:560px; text-wrap:pretty;\">Eight to twelve pages, written for you rather than assembled from a tool. Every review runs the same order, because the order is the argument.<\u002Fp>\n\n    <figure style=\"margin:0 0 30px;\">\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px;\">\n        <div style=\"border:1px solid #E7E2D9; overflow:hidden; background:#FAF8F4; display:flex;\">\n          <img src=\"02d91e4c-dbed-490e-9464-55b9004c6d24\" alt=\"The first page of the review for The Science Lever, headed sciencelever.com, opening with a paragraph titled The read\" style=\"width:100%; display:block;\">\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E7E2D9; overflow:hidden; background:#FAF8F4; display:flex;\">\n          <img src=\"c0558613-a624-4fe0-8316-942715a2c6ea\" alt=\"The findings table from the same review, eleven findings ranked critical, moderate and minor\" style=\"width:100%; display:block;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"margin-top:12px; font-size:14.5px; line-height:1.55; color:#6B6661;\">From a recent review for The Science Lever, a claims and molecular science consultancy. The opening read, and the findings table that follows the positioning argument.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:0 40px;\">\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">01<\u002Fspan><span>The read, in three sentences<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">02<\u002Fspan><span>Where it stands<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">03<\u002Fspan><span>Positioning, the site, the proof<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">04<\u002Fspan><span>Findings at a glance, severity ranked<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">05<\u002Fspan><span>The critical few, argued in full<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">06<\u002Fspan><span>What it becomes<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">07<\u002Fspan><span>Keep doing this<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">08<\u002Fspan><span>Actions for one weekend<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; padding:11px 0; border-top:1px solid #E7E2D9; border-bottom:1px solid #E7E2D9; font-size:15px; line-height:1.45;\"><span style=\"color:#C8492E; font-weight:600; flex:none;\">09<\u002Fspan><span>What I would do next<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:38px 56px 36px; border-bottom:1px solid #E7E2D9; display:flex; gap:44px; flex-wrap:wrap;\">\n    <div style=\"flex:1 1 300px; min-width:270px;\">\n      <h2 style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">What you get<\u002Fh2>\n      <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15.5px; line-height:1.5; color:#1A1A1A;\">\n        <div style=\"display:flex; gap:12px;\"><span aria-hidden=\"true\" style=\"color:#C8492E;\">/<\u002Fspan><span>An intake form, 20 to 30 minutes of writing, so the review starts from your business rather than my guess at it.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px;\"><span aria-hidden=\"true\" style=\"color:#C8492E;\">/<\u002Fspan><span>A written review of the homepage and up to three key pages, in one document.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px;\"><span aria-hidden=\"true\" style=\"color:#C8492E;\">/<\u002Fspan><span>A technical pass run as code, not by eye. Broken links, accessibility, share metadata, stale content.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px;\"><span aria-hidden=\"true\" style=\"color:#C8492E;\">/<\u002Fspan><span>A fix list ordered by what wins you the most, scoped to one weekend of work.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px;\"><span aria-hidden=\"true\" style=\"color:#C8492E;\">/<\u002Fspan><span>A 45 minute walkthrough, recorded, so the people doing the work can watch it.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px;\"><span aria-hidden=\"true\" style=\"color:#C8492E;\">/<\u002Fspan><span>A scoped proposal for the single highest-leverage fix, priced.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:0 1 260px; min-width:230px;\">\n      <h2 style=\"margin:0 0 18px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">Not included<\u002Fh2>\n      <div style=\"display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.5; color:#6B6661;\">\n        <div>Implementation<\u002Fdiv>\n        <div>Copywriting or design production<\u002Fdiv>\n        <div>Anything ongoing<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13.5px; line-height:1.55; color:#6B6661; margin-top:16px;\">Each of those is its own engagement. The review tells you which one you need.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:38px 56px 36px; border-bottom:1px solid #E7E2D9;\">\n    <h2 style=\"margin:0 0 22px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">How it works<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:20px;\">\n      <div style=\"border-top:1px solid #1A1A1A; padding-top:14px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#C8492E; font-weight:600; margin-bottom:8px;\">Day zero<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.5; color:#1A1A1A;\">The free 30 minute strategy fit call. If it is a fit, we book the review and the intake comes to you the same day.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1A1A1A; padding-top:14px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#C8492E; font-weight:600; margin-bottom:8px;\">Days one to five<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.5; color:#1A1A1A;\">You fill in the intake, at a desk, in your own time. It comes back at least 24 hours before we meet.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1A1A1A; padding-top:14px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#C8492E; font-weight:600; margin-bottom:8px;\">Day seven<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.5; color:#1A1A1A;\">The document lands, a day ahead. Read it before we talk.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1A1A1A; padding-top:14px;\">\n        <div style=\"font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#C8492E; font-weight:600; margin-bottom:8px;\">Day eight<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.5; color:#1A1A1A;\">45 minutes together. We argue about the positioning and agree the order.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:26px 0 0; font-size:16px; line-height:1.6; color:#1A1A1A; max-width:600px; text-wrap:pretty;\">It ends one of two ways, and I say which out loud on the call. Either here is what a build would take, scoped and priced, or here is what to do yourself. The document is yours either way, and the second ending is a real one.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"padding:44px 56px; border-bottom:1px solid #E7E2D9; background:#F1ECE3; display:flex; gap:40px; align-items:flex-start; flex-wrap:wrap;\">\n    <div style=\"flex:0 0 auto;\">\n      <h2 style=\"margin:0 0 14px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">Price<\u002Fh2>\n      <div style=\"font-size:13.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B6661; font-weight:600; margin-bottom:6px;\">Fixed fee<\u002Fdiv>\n      <div style=\"font-family:'Fraunces',serif; font-variation-settings:'opsz' 144,'wght' 600; font-size:64px; line-height:1; letter-spacing:-0.015em;\">{{ price }}<\u002Fdiv>\n      <div style=\"font-size:13.5px; color:#6B6661; margin-top:8px;\">Fixed for the scope above. Paid up front.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 300px; min-width:280px; display:flex; flex-direction:column; gap:14px; padding-top:34px;\">\n      <sc-if value=\"{{ showIntroRate }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:16px; line-height:1.55; color:#B23E26;\"><strong style=\"font-weight:600;\">Introductory rate: {{ introPrice }} for the next three reviews.<\u002Fstrong> The studio is new and I want the first cases on the record. After three it is the standard fee.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"font-size:16px; line-height:1.55; color:#1A1A1A;\"><strong style=\"font-weight:600;\">Credited in full against a build.<\u002Fstrong> Builds start at {{ buildFrom }}. If you engage within {{ creditWindow }} of the walkthrough, the whole review fee comes off the project. You are not paying twice to find out whether we should work together.<\u002Fdiv>\n      <div style=\"font-size:16px; line-height:1.55; color:#1A1A1A;\"><strong style=\"font-weight:600;\">If I find nothing, you pay nothing.<\u002Fstrong> It has not happened yet. If it does, you get the document saying so and your money back, and you can quote me on it.<\u002Fdiv>\n      <div style=\"font-size:15px; line-height:1.55; color:#6B6661;\">{{ capacity }}, so the build calendar stays protected.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:40px 56px 38px; border-bottom:1px solid #E7E2D9;\">\n    <h2 style=\"margin:0 0 24px; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:#6B6661; font-weight:600;\">Reasonable questions<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; gap:20px;\">\n      <div>\n        <h3 style=\"margin:0 0 5px; font-size:16px; font-weight:600;\">What if I disagree with the positioning read?<\u002Fh3>\n        <div style=\"font-size:15.5px; line-height:1.55; color:#6B6661;\">Then the walkthrough is where we settle it. Every finding is argued from evidence on your page, so it is a debate you can win.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0 0 5px; font-size:16px; font-weight:600;\">Who owns the document?<\u002Fh3>\n        <div style=\"font-size:15.5px; line-height:1.55; color:#6B6661;\">You do, outright. Take it to whoever you like. If the thinking is good enough you will want the person who did it.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"start\" style=\"padding:48px 56px 52px; display:flex; gap:36px; align-items:flex-start; flex-wrap:wrap;\">\n    <div style=\"flex:1 1 340px; min-width:300px;\">\n      <h2 style=\"margin:0 0 12px; font-family:'Fraunces',serif; font-variation-settings:'opsz' 90,'wght' 500; font-size:32px; line-height:1.25; letter-spacing:-0.015em;\">Book the strategy fit call.<\u002Fh2>\n      <p style=\"margin:0 0 14px; font-size:16.5px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">Free, 30 minutes. Three questions when you book, so we start the call already knowing where to look: your site, what is prompting this now, and the range you have in mind.<\u002Fp>\n      <p style=\"margin:0; font-size:16.5px; line-height:1.6; color:#1A1A1A; text-wrap:pretty;\">If it is a fit, we book the review on the call and the intake reaches you the same day. If it is not, I will say so before you pay for anything.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:0 1 240px; min-width:220px; padding-top:6px;\">\n      <a href=\"mailto:hello@makeitland.studio?subject=Strategy%20fit%20call\" style=\"display:inline-block; background:#B23E26; color:#FAF8F4; font-size:15px; font-weight:600; padding:13px 24px;\">Book the free call<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:20px 56px 26px; border-top:1px solid #E7E2D9; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:13px; color:#6B6661;\">\n    <div>Make It Land Studio<\u002Fdiv>\n    <div>Built to be chosen, not just seen.<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900},&quot;packageName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Positioning and Site Review&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$2,500&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;introPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$1,500&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showIntroRate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;buildFrom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$8,500&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;creditWindow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;14 days&quot;,&quot;30 days&quot;,&quot;60 days&quot;],&quot;default&quot;:&quot;60 days&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;capacity&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Four a month&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      packageName: this.props.packageName ?? \"Positioning and Site Review\",\n      price: this.props.price ?? \"$2,500\",\n      introPrice: this.props.introPrice ?? \"$1,500\",\n      showIntroRate: this.props.showIntroRate ?? true,\n      buildFrom: this.props.buildFrom ?? \"$8,500\",\n      creditWindow: this.props.creditWindow ?? \"60 days\",\n      capacity: this.props.capacity ?? \"Four a month\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
